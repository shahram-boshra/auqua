name: CI
on:
  pull_request:
  push:
    branches: [main]
env:
  UV_VERSION: "0.13.5"  # exact uv for CI; pyproject.toml holds only a floor (ADR 0033)
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy
      - run: uv run --locked lint-imports
      - run: uv run --locked pytest -q
      - run: uv build --no-sources
  hooks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      # The provenance hook scans staged files only; CI runs it in --all mode below.
      # provenance-push runs at the pre-push stage only, so it is not selected here.
      - run: uv run --locked pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: provenance-scan
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --project tools
      # SCANOSS is matched on the workstation at commit and push: the OSSKB
      # rate-limits GitHub-hosted runners (decision log a10).
      - run: uv run --locked --project tools python tools/provenance_scan.py --all --no-scanoss
