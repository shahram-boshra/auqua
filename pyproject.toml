[project]
name = "auqua"
version = "0.1.0"
description = "Open-core, low-frequency multi-asset quantitative trading platform."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Asadollah Boshra" }]
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "duckdb>=1.5.6",
    "msgspec>=0.22.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
]

[project.urls]
Repository = "https://github.com/shahram-boshra/auqua"

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "hypothesis>=6.170.1",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "reuse>=6.2.0",
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv]
# A floor, not an exact pin (ADR 0033): Dependabot runs only its own uv and
# refuses a project whose required-version excludes it. CI installs the exact
# uv from UV_VERSION in each workflow.
required-version = ">=0.13.5"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S", "PT", "N", "C4", "PTH", "DTZ", "T20", "ERA", "D", "ANN", "PL", "TID251"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["auqua", "tools"]

# Wall-clock calls are allowed only at the ingestion boundary (ADR 0009, ADR 0015).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"time.time".msg = "read time from auqua.clock (ADR 0009)"
"time.time_ns".msg = "read time from auqua.clock (ADR 0009)"
"datetime.datetime.now".msg = "read time from auqua.clock (ADR 0009)"
"datetime.datetime.utcnow".msg = "read time from auqua.clock (ADR 0009)"
"datetime.date.today".msg = "read time from auqua.clock (ADR 0009)"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/auqua/clock/wall.py" = ["TID251"]
"src/auqua/ingestion/**" = ["TID251"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
files = ["src", "tests", "tools"]
plugins = ["pydantic.mypy"]

# pyarrow 26.0.0 ships no type information (no py.typed, no stubs); its values
# are typed at the auqua.storage boundary (ADR 0022).
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]

[tool.importlinter]
root_package = "auqua"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The public platform never imports the private Alpha engine (ADR 0003)"
type = "forbidden"
source_modules = ["auqua"]
forbidden_modules = ["auqua_alpha"]

[[tool.importlinter.contracts]]
name = "Shared contracts and the clock import no other auqua subpackage (BP0 B4.2)"
type = "forbidden"
source_modules = ["auqua.contracts", "auqua.clock"]
forbidden_modules = [
    "auqua.alpha",
    "auqua.analytics",
    "auqua.config",
    "auqua.execution",
    "auqua.ingestion",
    "auqua.operations",
    "auqua.portfolio",
    "auqua.risk",
    "auqua.storage",
    "auqua.telemetry",
    "auqua.visualization",
]

[[tool.importlinter.contracts]]
name = "Configuration and storage import no component above them (BP3 section 4)"
type = "forbidden"
source_modules = ["auqua.config", "auqua.storage"]
forbidden_modules = [
    "auqua.alpha",
    "auqua.analytics",
    "auqua.execution",
    "auqua.ingestion",
    "auqua.operations",
    "auqua.portfolio",
    "auqua.risk",
    "auqua.telemetry",
    "auqua.visualization",
]

[[tool.importlinter.contracts]]
name = "Configuration does not import storage (BP3 section 4)"
type = "forbidden"
source_modules = ["auqua.config"]
forbidden_modules = ["auqua.storage"]

[[tool.importlinter.contracts]]
name = "Ingestion imports no component above it (BP4 section 2)"
type = "forbidden"
source_modules = ["auqua.ingestion"]
forbidden_modules = [
    "auqua.alpha",
    "auqua.analytics",
    "auqua.execution",
    "auqua.operations",
    "auqua.portfolio",
    "auqua.risk",
    "auqua.telemetry",
    "auqua.visualization",
]

[[tool.importlinter.contracts]]
name = "Pre-trade risk is independent of the components it checks (Strategy Module 7; ADR 0025)"
type = "forbidden"
source_modules = ["auqua.risk"]
forbidden_modules = [
    "auqua.alpha",
    "auqua.analytics",
    "auqua.execution",
    "auqua.ingestion",
    "auqua.portfolio",
    "auqua.visualization",
]

[[tool.importlinter.contracts]]
name = "Signals do not reach orders, risk or the venue directly (ADR 0025)"
type = "forbidden"
source_modules = ["auqua.alpha"]
forbidden_modules = ["auqua.execution", "auqua.portfolio", "auqua.risk", "auqua.analytics"]

[[tool.importlinter.contracts]]
name = "Components do not import the backtest runner (ADR 0025)"
type = "forbidden"
source_modules = [
    "auqua.alpha",
    "auqua.execution",
    "auqua.ingestion",
    "auqua.portfolio",
    "auqua.risk",
    "auqua.visualization",
]
forbidden_modules = ["auqua.analytics"]
